spring:
  application:
    name: ${FINANCE_SERVICE_NAME:finance-harness-be}
  datasource:
    url: ${FINANCE_DB_URL}
    username: ${FINANCE_DB_USERNAME}
    password: ${FINANCE_DB_PASSWORD}
    hikari:
      pool-name: finance-db
      data-source-properties:
        ApplicationName: ${FINANCE_DB_APPLICATION_NAME:finance-harness-be}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

management:
  server:
    port: ${FINANCE_MANAGEMENT_PORT:8081}
    address: ${FINANCE_MANAGEMENT_BIND_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  metrics:
    tags:
      service: finance-harness-be
      environment: ${FINANCE_METRICS_ENVIRONMENT:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests:
          - 5ms
          - 10ms
          - 25ms
          - 50ms
          - 100ms
          - 250ms
          - 500ms
          - 1s
          - 2500ms
          - 5s
          - 10s
          - 15s
          - 30s
logging:
  include-application-name: true
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${FINANCE_SERVICE_NAME:finance-harness-be}
        environment: ${SPRING_PROFILES_ACTIVE:default}
