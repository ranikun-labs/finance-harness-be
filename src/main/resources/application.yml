spring:
  application:
    name: ${FINANCE_SERVICE_NAME:finance-harness-be}
  datasource:
    url: ${FINANCE_DB_URL}
    username: ${FINANCE_DB_USERNAME}
    password: ${FINANCE_DB_PASSWORD}
    hikari:
      data-source-properties:
        ApplicationName: ${FINANCE_DB_APPLICATION_NAME:finance-harness-be}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true

logging:
  include-application-name: true
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${FINANCE_SERVICE_NAME:finance-harness-be}
        environment: ${SPRING_PROFILES_ACTIVE:default}
