name: Verify exact Finance BE candidate
on:
  push:
    branches: [codex/verify-finance-be-f8d2475]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f8d24754bd3b9f7f5f977b52c2bad20305d5ae62
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "f8d24754bd3b9f7f5f977b52c2bad20305d5ae62"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew test --no-daemon --stacktrace --console=plain

