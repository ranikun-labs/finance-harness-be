name: Finance investment composite API E2E

on:
  push:
    branches:
      - codex/rpl34-finance-investment-api-e2e-20261118
    paths:
      - .github/workflows/finance-investment-composite-api-e2e.yml
      - scripts/e2e/finance-investment-composite-api-e2e.mjs
      - scripts/e2e/run-finance-investment-composite-api-e2e.sh

permissions:
  contents: read

concurrency:
  group: finance-investment-composite-api-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-composite-e2e:
    if: github.repository == 'ranikun-labs/finance-harness-be' && github.ref == 'refs/heads/codex/rpl34-finance-investment-api-e2e-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out workflow candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out merged Finance receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ranikun-labs/finance-harness-be
          ref: 5cab16ab7ba04d0bf65b77b1ebca976d6d29e1dc
          path: finance-source
          persist-credentials: false
      - name: Check out merged Core and Gateway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ranikun-labs/platform-services
          ref: 5a0b0dc38f1d53655cc21613f9b202a317d7c37d
          path: platform-source
          persist-credentials: false
      - name: Bind workflow and service source trees
        shell: bash
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/rpl34-finance-investment-api-e2e-20261118"
          test "$(git -C candidate rev-parse HEAD)" = "$WORKFLOW_SOURCE_SHA"
          test "$(git -C finance-source rev-parse HEAD)" = "5cab16ab7ba04d0bf65b77b1ebca976d6d29e1dc"
          test "$(git -C finance-source rev-parse 'HEAD^{tree}')" = "d598dadb2677b2ac73488b6ab34f6e278aab009c"
          test "$(git -C platform-source rev-parse HEAD)" = "5a0b0dc38f1d53655cc21613f9b202a317d7c37d"
          test "$(git -C platform-source rev-parse 'HEAD^{tree}')" = "9057914850b9e0026fa8851cbb062c692a51b4b3"
          test "$(git -C platform-source rev-parse HEAD:gateway-app/src/main/resources/application.yml)" = "16749f29e103292d0f71e2127e79f1f093f4e123"
          printf 'workflow_source_sha=%s\nfinance_source_sha=%s\nfinance_tree=d598dadb2677b2ac73488b6ab34f6e278aab009c\nplatform_source_sha=%s\nplatform_tree=9057914850b9e0026fa8851cbb062c692a51b4b3\ngateway_default_config_blob=16749f29e103292d0f71e2127e79f1f093f4e123\n' \
            "$WORKFLOW_SOURCE_SHA" \
            "$(git -C finance-source rev-parse HEAD)" \
            "$(git -C platform-source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 17 and 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Run exact-source three-service API flow
        working-directory: candidate
        run: >-
          ./scripts/e2e/run-finance-investment-composite-api-e2e.sh
          "$GITHUB_WORKSPACE/finance-source"
          "$GITHUB_WORKSPACE/platform-source"
