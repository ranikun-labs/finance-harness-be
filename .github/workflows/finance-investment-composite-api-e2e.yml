name: Finance investment composite API E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finance-investment-composite-api-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  disposable-composite-e2e:
    if: github.repository == 'ranikun-labs/finance-harness-be' && github.ref == 'refs/heads/main'
    # The read token is provided only through this environment (deployment branches: main; required reviewer).
    environment: dev-private-read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out workflow candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out Finance receiver at event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ranikun-labs/finance-harness-be
          ref: ${{ github.sha }}
          path: finance-source
          persist-credentials: false
      - name: Verify RANIKUN_DEV_READ_TOKEN is configured
        # Trusted events only. The job already requires refs/heads/main; this keeps the token off any future pull_request trigger.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RANIKUN_DEV_READ_TOKEN: ${{ secrets.RANIKUN_DEV_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Presence check only. The value is never echoed.
          if [ -z "${RANIKUN_DEV_READ_TOKEN:-}" ]; then
            echo "RANIKUN_DEV_READ_TOKEN missing: set environment secret in dev-private-read" >&2
            exit 1
          fi
      - name: Check out merged Core and Gateway
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ranikun-labs/platform-services
          ref: 5a0b0dc38f1d53655cc21613f9b202a317d7c37d
          path: platform-source
          token: ${{ secrets.RANIKUN_DEV_READ_TOKEN }}
          persist-credentials: false
      - name: Check out pinned Finance FE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ranikun-labs/finance-harness-fe
          ref: db97f7f370276c036c8f3eea57c1b6a73bb12006
          path: finance-fe-source
          persist-credentials: false
      - name: Bind workflow and service source trees
        shell: bash
        env:
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git -C candidate rev-parse HEAD)" = "$WORKFLOW_SOURCE_SHA"
          test "$(git -C finance-source rev-parse HEAD)" = "$WORKFLOW_SOURCE_SHA"
          test "$(git -C finance-source rev-parse 'HEAD^{tree}')" = "$(git -C candidate rev-parse 'HEAD^{tree}')"
          test "$(git -C platform-source rev-parse HEAD)" = "5a0b0dc38f1d53655cc21613f9b202a317d7c37d"
          test "$(git -C platform-source rev-parse 'HEAD^{tree}')" = "9057914850b9e0026fa8851cbb062c692a51b4b3"
          test "$(git -C platform-source rev-parse HEAD:gateway-app/src/main/resources/application.yml)" = "16749f29e103292d0f71e2127e79f1f093f4e123"
          test "$(git -C finance-fe-source rev-parse HEAD)" = "db97f7f370276c036c8f3eea57c1b6a73bb12006"
          test "$(git -C finance-fe-source rev-parse 'HEAD^{tree}')" = "ef476d89cbdc9dd10e6f71a069b8cbf9e9fff2d3"
          printf 'workflow_source_sha=%s\nfinance_source_sha=%s\nfinance_tree=%s\nplatform_source_sha=%s\nplatform_tree=9057914850b9e0026fa8851cbb062c692a51b4b3\nfinance_fe_source_sha=%s\nfinance_fe_tree=ef476d89cbdc9dd10e6f71a069b8cbf9e9fff2d3\ngateway_default_config_blob=16749f29e103292d0f71e2127e79f1f093f4e123\n' \
            "$WORKFLOW_SOURCE_SHA" \
            "$(git -C finance-source rev-parse HEAD)" \
            "$(git -C finance-source rev-parse 'HEAD^{tree}')" \
            "$(git -C platform-source rev-parse HEAD)" \
            "$(git -C finance-fe-source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 17 and 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            17
            21
      - name: Set up Node.js and pnpm for pinned FE
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - name: Install pinned FE dependencies and Chromium
        working-directory: finance-fe-source
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run exact-source API and browser flows
        working-directory: candidate
        env:
          FINANCE_SOURCE_SHA: ${{ github.sha }}
        run: >-
          ./scripts/e2e/run-finance-investment-composite-api-e2e.sh
          "$GITHUB_WORKSPACE/finance-source"
          "$GITHUB_WORKSPACE/platform-source"
          "$GITHUB_WORKSPACE/finance-fe-source"
