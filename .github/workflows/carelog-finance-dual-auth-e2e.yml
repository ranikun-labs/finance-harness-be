name: Carelog x Finance dual-auth E2E

on:
  push:
    branches: [claude/great-heisenberg-u3i75y]
    paths:
      - .github/workflows/carelog-finance-dual-auth-e2e.yml
      - scripts/e2e/run-carelog-finance-dual-auth-e2e.sh
      - scripts/e2e/carelog-finance-dual-auth-e2e.mjs
  workflow_dispatch:

permissions:
  contents: read

# Pins. FINANCE_EXPECTED_SHA must be an ancestor of the candidate (no history rewrite), and the cumulative
# diff from it to the candidate must be exactly the three files in the paths filter above, all added.
# PLATFORM_SERVICES_* are pinned to the verified platform-services commit and its git tree.
# CARELOG_ENROLLMENT_TARGET=stub: Carelog enrollment/claims are answered by an embedded synthetic stub,
# not by carelog-be. Real carelog-be registration/enrollment is NOT verified by this job.
env:
  FINANCE_EXPECTED_SHA: 31c4307b0c63ee62d70eec56eefd56d9960b6fa1
  PLATFORM_SERVICES_SHA: f9adfd3d338f482e7c2967512522e5b4e2354619
  PLATFORM_SERVICES_TREE: dbbd2b215e9a2de4e43067d1ad699db6665bbde6
  CARELOG_ENROLLMENT_TARGET: stub

concurrency:
  group: carelog-finance-dual-auth-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Main E2E. No environment, so no reviewer gate. platform-services is fetched anonymously and verified by tree.
  # The read token is NOT used here. The only token-related step only records whether the secret resolves in this
  # unprotected job (a boolean), so the probe job can tell whether the secret is also reachable from here.
  dual-auth-e2e:
    if: github.repository == 'ranikun-labs/finance-harness-be'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      token_in_unprotected: ${{ steps.tokcheck.outputs.token_in_unprotected }}
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - name: Check out candidate with parent history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          # Full history so FINANCE_EXPECTED_SHA (an ancestor, not necessarily HEAD^) is present for the pin check.
          fetch-depth: 0
          persist-credentials: false

      - name: Check read-token presence in this unprotected job (boolean only, never used)
        id: tokcheck
        shell: bash
        env:
          # Only a boolean is taken from the expression. The secret value itself is not passed to any step.
          HAS_READ_TOKEN: ${{ secrets.RANIKUN_DEV_READ_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_READ_TOKEN" = "true" ]; then v=yes; else v=no; fi
          echo "TOKEN_IN_UNPROTECTED_JOB=$v"
          echo "token_in_unprotected=$v" >> "$GITHUB_OUTPUT"

      - name: Record Carelog enrollment disclosure
        shell: bash
        run: |
          set -euo pipefail
          # Runs first so the disclosure is recorded even when a later pin check fails closed.
          test "$CARELOG_ENROLLMENT_TARGET" = "stub"
          {
            echo '## Carelog enrollment'
            echo '- Target: `CARELOG_ENROLLMENT_TARGET=stub`. Enrollment PUT and product-claims GET are answered by an embedded synthetic stub, not by carelog-be.'
            echo '- Verified here: Core calls the stub, and the verifier asserts the stub received exactly one enrollment.'
            echo '- Not covered: real carelog-be registration/enrollment — tracked separately'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Finance candidate pin
        shell: bash
        run: |
          set -euo pipefail
          # Fail-closed. No history rewrite: the base only has to be an ancestor of the candidate.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "FAIL-CLOSED: checked-out HEAD does not equal GITHUB_SHA."; exit 1; }
          git merge-base --is-ancestor "$FINANCE_EXPECTED_SHA" HEAD || {
            echo "FAIL-CLOSED: FINANCE_EXPECTED_SHA ($FINANCE_EXPECTED_SHA) is not an ancestor of the candidate."; exit 1; }
          # Cumulative diff from the base: only additions, and exactly the three owned files.
          test -z "$(git diff --name-status "$FINANCE_EXPECTED_SHA" HEAD | awk '$1 != "A"')" || {
            echo "FAIL-CLOSED: candidate modifies, renames or deletes files relative to the base."; exit 1; }
          expected="$(printf '%s\n' \
            .github/workflows/carelog-finance-dual-auth-e2e.yml \
            scripts/e2e/carelog-finance-dual-auth-e2e.mjs \
            scripts/e2e/run-carelog-finance-dual-auth-e2e.sh | sort)"
          actual="$(git diff --name-only --no-renames "$FINANCE_EXPECTED_SHA" HEAD | sort)"
          test "$actual" = "$expected" || {
            echo "FAIL-CLOSED: candidate file set differs from the three owned E2E files."; exit 1; }
          finance_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'finance_candidate_sha=%s\nfinance_candidate_tree=%s\nfinance_base_sha=%s\n' \
            "$GITHUB_SHA" "$finance_tree" "$FINANCE_EXPECTED_SHA" >> "$GITHUB_ENV"

      - name: Verify platform-services placeholder is filled
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PLATFORM_SERVICES_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL-CLOSED: PLATFORM_SERVICES_SHA is not a 40-hex commit SHA."; exit 1; }
          [[ "$PLATFORM_SERVICES_TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "FAIL-CLOSED: PLATFORM_SERVICES_TREE is not a 40-hex tree SHA."; exit 1; }

      # Anonymous fetch: platform-services is fetched without a token in this job.
      - name: Download and verify pinned platform-services source
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/platform-services.zip"
          unpack="$RUNNER_TEMP/platform-services"
          curl --fail --silent --show-error --location \
            "https://codeload.github.com/ranikun-labs/platform-services/zip/$PLATFORM_SERVICES_SHA" \
            -o "$archive"
          mkdir -p "$unpack"
          unzip -q "$archive" -d "$unpack"
          platform_dir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$platform_dir"
          chmod +x "$platform_dir/gradlew"
          git -C "$platform_dir" init -q
          git -C "$platform_dir" add -f -A
          platform_tree="$(git -C "$platform_dir" write-tree)"
          test "$platform_tree" = "$PLATFORM_SERVICES_TREE"
          echo "PLATFORM_SOURCE_DIR=$platform_dir" >> "$GITHUB_ENV"
          rm -f "$archive"

      - name: Record pinned sources in job summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Pinned sources'
            echo "- Finance candidate: \`$finance_candidate_sha\` (tree \`$finance_candidate_tree\`)"
            echo "- Finance base (ancestor): \`$finance_base_sha\`"
            echo "- Platform-services: \`$PLATFORM_SERVICES_SHA\` (tree \`$PLATFORM_SERVICES_TREE\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      # setup-java exports JAVA_HOME_17_X64 (Gateway) and JAVA_HOME_21_X64 (Core, Finance); the run script requires both.
      - name: Set up JDK 17 (Gateway) and JDK 21 (Core, Finance)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Run Carelog x Finance dual-auth flows
        shell: bash
        run: >-
          ./scripts/e2e/run-carelog-finance-dual-auth-e2e.sh
          "$GITHUB_WORKSPACE"
          "$PLATFORM_SOURCE_DIR"

  # Private read probe. Runs under the `dev-private-read` environment (Owner configures: deployment branch policy
  # limited to the candidate branch, required reviewers, environment secret RANIKUN_DEV_READ_TOKEN, and environment
  # variable APPROVED_PROBE_SHA = the reviewed commit SHA). Environment settings live outside the candidate branch,
  # so the candidate cannot change them. Verdict rules, all must hold for TRANSITION_EVIDENCE=protected:
  #   BOUNDARY=protected  requires: (a) this job runs under environment dev-private-read (declared below; the
  #     required-reviewer approval is the runtime proof); (b) vars.APPROVED_PROBE_SHA equals github.sha;
  #     (c) dual-auth-e2e reported TOKEN_IN_UNPROTECTED_JOB=no, i.e. no repo/org copy of the secret is reachable.
  #   Otherwise BOUNDARY is unapproved_sha or not_protected, and the token is never used.
  #   TRANSITION_EVIDENCE=protected requires BOUNDARY=protected AND the private platform-services check passes
  #   (not public, resolve 200 to the pinned SHA, archive download 200, git tree equals the pinned tree).
  #   Anything else prints TRANSITION_EVIDENCE=blocked reason=... and the job exits 0 (report-only).
  # Only runs under the protected environment count for the Private-switch decision.
  # The APPROVED_PROBE_SHA pin cannot live in the workflow file itself: a commit cannot contain its own SHA, so the
  # approval is held as an environment variable that only the Owner can set.
  private-read-probe:
    if: ${{ always() && github.repository == 'ranikun-labs/finance-harness-be' }}
    needs: dual-auth-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev-private-read
    concurrency:
      group: carelog-private-read-probe-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Trust gate. Candidate-editable, so it is defence in depth only. The enforcing controls are the
      # environment deployment branch policy, required reviewers, and the protected candidate branch.
      - name: Gate read token to trusted branch events
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          trusted_ref='refs/heads/claude/great-heisenberg-u3i75y'
          case "$EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo "FAIL-CLOSED: event $EVENT_NAME may not receive the read token." >&2; exit 1 ;;
          esac
          if [ "$REF" != "$trusted_ref" ]; then
            echo "FAIL-CLOSED: $EVENT_NAME from $REF may not receive the read token (trusted ref only)." >&2
            exit 1
          fi

      - name: Private read probe and boundary verdict
        id: probe
        shell: bash
        env:
          RANIKUN_DEV_READ_TOKEN: ${{ secrets.RANIKUN_DEV_READ_TOKEN }}
          APPROVED_PROBE_SHA: ${{ vars.APPROVED_PROBE_SHA }}
          TOKEN_IN_UNPROTECTED: ${{ needs.dual-auth-e2e.outputs.token_in_unprotected }}
          RUN_SHA: ${{ github.sha }}
          PLATFORM_SERVICES_SHA: ${{ env.PLATFORM_SERVICES_SHA }}
          PLATFORM_SERVICES_TREE: ${{ env.PLATFORM_SERVICES_TREE }}
        run: |
          set -uo pipefail
          # Never enable tracing here. Bodies and the token are never printed; only codes and fixed words are.
          work="$(mktemp -d "$RUNNER_TEMP/private-probe.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # The token reaches curl only through a process-substitution config file, never argv.
          auth_cfg() { printf 'header = "Authorization: Bearer %s"\n' "$RANIKUN_DEV_READ_TOKEN"; }

          # ---- Boundary verdict (checks a, b, c) ----
          # Boundary-breaking findings are reported before the approval-pin finding, so the verdict names the real cause.
          if [ "$TOKEN_IN_UNPROTECTED" = "yes" ]; then
            boundary="not_protected (org/repo secret also provided)"
          elif [ "$TOKEN_IN_UNPROTECTED" != "no" ]; then
            boundary="not_protected (unprotected-job check missing)"
          elif [ -z "$APPROVED_PROBE_SHA" ] || [ "$APPROVED_PROBE_SHA" != "$RUN_SHA" ]; then
            boundary="unapproved_sha"
          else
            boundary="protected"
          fi
          echo "BOUNDARY=$boundary"
          echo "- BOUNDARY=$boundary" >> "$GITHUB_STEP_SUMMARY"

          if [ "$boundary" != "protected" ]; then
            # Token is never used unless the boundary is protected.
            echo "TRANSITION_EVIDENCE=blocked reason=boundary:${boundary%% *}"
            echo "- transition=blocked (boundary: $boundary)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # ---- Private checks ----
          reason=""
          if [ -z "${RANIKUN_DEV_READ_TOKEN:-}" ]; then
            reason="token_not_provided"
          fi

          if [ -z "$reason" ]; then
            anon="$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/ranikun-labs/platform-services 2>/dev/null)" || anon=000
            res_http="$(curl -s -o "$work/commit.json" -w '%{http_code}' --config <(auth_cfg) \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/ranikun-labs/platform-services/commits/$PLATFORM_SERVICES_SHA" 2>/dev/null)" || res_http=000
            resolved="$(jq -r '.sha // empty' "$work/commit.json" 2>/dev/null || true)"
            rm -f "$work/commit.json"
            sha_match=fail; [ "$resolved" = "$PLATFORM_SERVICES_SHA" ] && sha_match=ok
            dl_http=000; tree_match=fail
            archive="$work/platform-services.zip"
            dl_http="$(curl -s -o "$archive" -w '%{http_code}' --location --config <(auth_cfg) \
              "https://codeload.github.com/ranikun-labs/platform-services/zip/$PLATFORM_SERVICES_SHA" 2>/dev/null)" || dl_http=000
            if [ "$dl_http" = "200" ]; then
              unpack="$work/platform-services"; mkdir -p "$unpack"
              unzip -q "$archive" -d "$unpack" 2>/dev/null || true
              pdir="$(find "$unpack" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null)"
              if [ -n "$pdir" ]; then
                git -C "$pdir" init -q && git -C "$pdir" add -f -A
                tree="$(git -C "$pdir" write-tree 2>/dev/null || true)"
                [ "$tree" = "$PLATFORM_SERVICES_TREE" ] && tree_match=ok
              fi
            fi
            rm -rf "$work/platform-services" "$archive"
            line="REPO=platform-services ANON=$anon RESOLVE_HTTP=$res_http DOWNLOAD_HTTP=$dl_http SHA_MATCH=$sha_match TREE_MATCH=$tree_match"
            echo "$line"; echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            if [ "$anon" = "200" ]; then reason="target_repo_is_public_not_a_private_read"
            elif [ "$res_http" != "200" ] || [ "$sha_match" != ok ]; then reason="resolve_failed_or_sha_mismatch"
            elif [ "$dl_http" != "200" ] || [ "$tree_match" != ok ]; then reason="archive_or_tree_mismatch"
            fi
          fi

          # Informational only (unpinned, not gating): HEAD resolve status of the other private repos.
          for r in design-system shared-ai-fastapi-poc; do
            code="$(curl -s -o "$work/i.json" -w '%{http_code}' --config <(auth_cfg) \
              -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/ranikun-labs/$r/commits/HEAD" 2>/dev/null)" || code=000
            echo "INFO REPO=$r RESOLVE_HTTP=$code (unpinned, not gating)"
            rm -f "$work/i.json"
          done

          if [ -z "$reason" ]; then
            echo "TRANSITION_EVIDENCE=protected"
            echo "- transition=protected" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TRANSITION_EVIDENCE=blocked reason=$reason"
            echo "- transition=blocked (reason: $reason)" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Report-only: verdict lines are the signal; the job does not fail the workflow.
          exit 0
