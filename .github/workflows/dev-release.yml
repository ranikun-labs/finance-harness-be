name: Finance DEV release

on:
  workflow_dispatch:
    inputs:
      deploy_enabled:
        description: Deploy the published digest to DEV (false publishes only)
        type: boolean
        default: false
        required: true

permissions: {}

jobs:
  test:
    if: github.repository == 'ranikun-labs/finance-harness-be' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Finance native tests
        run: ./gradlew test --no-daemon --stacktrace --console=plain

  release:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@fdeb22805d9f26779073dc68c6f0a9a166ccb884
    with:
      service: finance
      dockerfile: Dockerfile
      context: .
      deploy_enabled: ${{ inputs.deploy_enabled }}
      test_sha: ${{ github.sha }}
