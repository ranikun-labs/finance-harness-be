name: Finance DEV release

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      deploy_enabled:
        description: Deploy the published digest to DEV (false publishes only)
        type: boolean
        default: false
        required: true

permissions: {}

jobs:
  auto-release-gate:
    if: github.event_name == 'push' && github.repository == 'ranikun-labs/finance-harness-be' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev-finance-auto-release
    permissions: {}
    steps:
      - name: Require explicit DEV activation and readiness
        env:
          AUTO_RELEASE_ENABLED: ${{ vars.FINANCE_DEV_AUTO_RELEASE_ENABLED }}
          OIDC_READY: ${{ vars.FINANCE_DEV_OIDC_READY }}
          MIGRATION_CONTRACT_READY: ${{ vars.FINANCE_DEV_MIGRATION_CONTRACT_READY }}
        run: |
          set -euo pipefail
          [[ "$AUTO_RELEASE_ENABLED" == 'true' && "$OIDC_READY" == 'true' && "$MIGRATION_CONTRACT_READY" == 'true' ]] || {
            echo 'DEV automatic release is disabled or readiness has not been confirmed.' >&2
            exit 1
          }

  test:
    needs: auto-release-gate
    if: >-
      always() && github.repository == 'ranikun-labs/finance-harness-be' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.auto-release-gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Finance native tests
        run: ./gradlew test --no-daemon --stacktrace --console=plain

  release:
    needs: test
    permissions:
      contents: read
      id-token: write
    uses: ranikun-labs/platform-infra/.github/workflows/dev-ecs-release.yml@4cf8bfedd7454be3a314b22a165d2555fc096fe2
    with:
      service: finance
      dockerfile: Dockerfile
      context: .
      deploy_enabled: ${{ github.event_name == 'push' || inputs.deploy_enabled }}
      test_sha: ${{ github.sha }}
      require_current_dev_tip: ${{ github.event_name == 'push' }}
