name: finance-harness-be

services:
  finance-harness-be:
    image: finance-harness-be:${FINANCE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${FINANCE_HTTP_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    expose:
      - "8081"
    environment:
      FINANCE_SERVICE_NAME: finance-harness-be
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FINANCE_DB_URL: ${FINANCE_DB_URL:-}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USERNAME:-}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-}
      FINANCE_DB_APPLICATION_NAME: ${FINANCE_DB_APPLICATION_NAME:-finance-harness-be}
      FINANCE_MANAGEMENT_PORT: 8081
      FINANCE_MANAGEMENT_BIND_ADDRESS: 0.0.0.0
      # 기본값은 production(안전 기본값). DEV 기동 시 FINANCE_METRICS_ENVIRONMENT=dev 등으로 명시 override.
      FINANCE_METRICS_ENVIRONMENT: ${FINANCE_METRICS_ENVIRONMENT:-production}
      FINANCE_TRUSTED_CONTEXT_SERVICE_SECRET: ${FINANCE_TRUSTED_CONTEXT_SERVICE_SECRET:-}
    mem_limit: 768m
    cpus: 1.0
