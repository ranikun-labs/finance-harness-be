name: finance-harness-be

services:
  finance-harness-be:
    image: finance-harness-be:${FINANCE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "${FINANCE_HTTP_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    environment:
      FINANCE_SERVICE_NAME: finance-harness-be
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      FINANCE_DB_URL: ${FINANCE_DB_URL:-}
      FINANCE_DB_USERNAME: ${FINANCE_DB_USERNAME:-}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:-}
      FINANCE_DB_APPLICATION_NAME: ${FINANCE_DB_APPLICATION_NAME:-finance-harness-be}
    mem_limit: 768m
    cpus: 1.0
